# Builds OpenAbyss for Linux (an AppImage) and Windows (a zip) on every
# push and pull request; a tag v* also publishes both as a GitHub release.
# SDL 3 is built from source in both, so each package carries its own.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04          # an older glibc, so the AppImage runs on more systems
    steps:
      - uses: actions/checkout@v7
      - name: SDL's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libegl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libdecor-0-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENABYSS_VENDORED_SDL=ON \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          DESTDIR=$PWD/AppDir cmake --install build      # the program, and the SDL built with it
      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1   # the runners have no FUSE: linuxdeploy and its plugin run unpacked
          OUTPUT: OpenAbyss-x86_64.AppImage   # the AppImage's name
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run --appdir AppDir \
            --executable AppDir/usr/bin/openabyss \
            --desktop-file dist/openabyss.desktop --icon-file dist/openabyss.png \
            --output appimage
          test -f OpenAbyss-x86_64.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: OpenAbyss-linux
          path: OpenAbyss-x86_64.AppImage

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            git
            zip
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENABYSS_VENDORED_SDL=ON
          cmake --build build
      - name: Package
        run: |
          mkdir OpenAbyss
          cp build/openabyss.exe build/SDL3.dll README.md LICENSE OpenAbyss/
          zip -r OpenAbyss-windows-x86_64.zip OpenAbyss
      - uses: actions/upload-artifact@v7
        with:
          name: OpenAbyss-windows
          path: OpenAbyss-windows-x86_64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/OpenAbyss-x86_64.AppImage
            artifacts/OpenAbyss-windows-x86_64.zip
